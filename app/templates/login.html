<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='brand/icon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='brand/icon-16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='brand/icon-180-apple-touch.png') }}">
  <title>Anmelden - LiveVoice Streamer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="login-main">
    <div class="card login-card">
      <img class="brand-logo login-logo" src="{{ url_for('static', filename='brand/logo-lockup-light.svg') }}" alt="LiveVoice Streamer">

      {% if error %}<p class="error">{{ error }}</p>{% endif %}

      {% if need_admin and not error %}<p class="hint">Für die Einstellungen ist das Admin-Passwort nötig.</p>{% endif %}

      <form method="post" action="{{ url_for('login_submit') }}">
        <input type="hidden" name="next" value="{{ next }}">
        {% if need_admin %}<input type="hidden" name="need_admin" value="1">{% endif %}
        <label for="password">{{ "Admin-Passwort" if need_admin else "Passwort" }}</label>
        <div class="row-with-button">
          <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
          <button type="button" class="btn-icon btn-secondary password-toggle" data-target="password"
                  aria-label="Passwort anzeigen">👁</button>
        </div>
        <button type="submit" class="btn btn-start login-submit">Anmelden</button>
      </form>
    </div>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
