# Nur Referenz: Die App schreibt diesen Alias automatisch als ~/.asoundrc des
# Dienstbenutzers für das in den Einstellungen gewählte Gerät
# (app/audio.py::write_dsnoop_config). "Audio" ist ein Beispiel für die
# ALSA-Kartenkennung aus `arecord -l` (z.B. Focusrite Scarlett 2i2).
pcm.livevoice_dsnoop {
    type dsnoop
    ipc_key 219347
    slave {
        pcm "hw:CARD=Audio,DEV=0"
        channels 2
        rate 48000
        format S16_LE
    }
}
pcm.livevoice_capture {
    type plug
    slave.pcm "livevoice_dsnoop"
}
